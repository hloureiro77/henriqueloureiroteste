<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Obras — Alumínios do Zela</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:Arial,sans-serif;background:#eef2f6;margin:0;color:#1e293b}
    header{background:#17375e;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-size:24px}
    .container{padding:20px}
    .toolbar{margin-bottom:16px}
    button{background:#25568f;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
    button:hover{background:#1d4877}
    .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .column{background:#dde5ee;border-radius:8px;padding:12px}
    .column h2{margin-top:0;font-size:16px}
    .card{background:#fff;border-radius:6px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .card strong{display:block;margin-bottom:6px}
    .meta{font-size:12px;color:#64748b}
    .hidden{display:none}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
    .modal-content{background:#fff;padding:20px;border-radius:8px;width:420px;max-width:95vw}
    .modal-content input,.modal-content textarea,.modal-content select{width:100%;padding:8px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
    .actions{display:flex;gap:10px;justify-content:flex-end}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
    th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}
    @media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.kanban{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <h1>Mapa de Obras — Alumínios do Zela</h1>
  <div style="display:flex;gap:10px">
    <button id="btnKanban">Kanban</button>
    <button id="btnLista">Lista</button>
    <button id="btnNova">+ Nova Obra</button>
  </div>
</header>

<div class="container">
  <div id="kanbanView" class="kanban">
    <div class="column">
      <h2>Adjudicada</h2>
      <div id="col-adjudicada"></div>
    </div>
    <div class="column">
      <h2>Produção</h2>
      <div id="col-producao"></div>
    </div>
    <div class="column">
      <h2>Montagem</h2>
      <div id="col-montagem"></div>
    </div>
    <div class="column">
      <h2>Concluída</h2>
      <div id="col-concluida"></div>
    </div>
  </div>

  <div id="listView" class="hidden">
    <table>
      <thead>
        <tr>
          <th>Referência</th>
          <th>Obra</th>
          <th>Cliente</th>
          <th>Estado</th>
          <th>Responsável</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h2>Nova Obra</h2>
    <input id="obraNome" placeholder="Nome da obra">
    <input id="obraCliente" placeholder="Cliente">
    <select id="obraEstado">
      <option>Adjudicada</option>
      <option>Produção</option>
      <option>Montagem</option>
      <option>Concluída</option>
    </select>
    <input id="obraResponsavel" placeholder="Responsável">
    <textarea id="obraNotas" rows="4" placeholder="Notas"></textarea>
    <div class="actions">
      <button id="btnCancelar" type="button">Cancelar</button>
      <button id="btnGuardar" type="button">Guardar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cjofjcvkpgoavpwxnvyv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0AJJL2JOpJ8mKRMOcHFYtA_URIW0LVz';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = { obras: [] };

function cid(){
  return Date.now();
}

function nextReferencia(){
  const year = new Date().getFullYear();
  const next = state.obras.length + 1;
  return 'ZL-' + year + '-' + String(next).padStart(3,'0');
}

async function loadData(){
  try{
    const { data, error } = await supabaseClient
      .from('obras')
      .select('*')
      .order('id',{ ascending:false });

    if(error){
      console.error(error);
      state.obras = [];
    } else {
      state.obras = (data || []).map(o => ({
        id: o.id,
        referencia: o.referencia || '',
        nome: o.nome || '',
        cliente: o.cliente || '',
        status: o.estado || 'Adjudicada',
        responsavel: o.responsavel || '',
        notas: o.notas || ''
      }));
    }
  } catch(e){
    console.error(e);
    state.obras = [];
  }

  render();
}

async function saveObra(obra){
  const { error } = await supabaseClient.from('obras').upsert({
    id: obra.id,
    referencia: obra.referencia,
    nome: obra.nome,
    cliente: obra.cliente,
    estado: obra.status,
    responsavel: obra.responsavel,
    notas: obra.notas
  });

  if(error){
    console.error(error);
    alert('Erro ao guardar no Supabase');
  }
}

function renderKanban(){
  const cols = {
    'Adjudicada':'col-adjudicada',
    'Produção':'col-producao',
    'Montagem':'col-montagem',
    'Concluída':'col-concluida'
  };

  Object.values(cols).forEach(id => {
    document.getElementById(id).innerHTML = '';
  });

  state.obras.forEach(obra => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <strong>${obra.referencia}</strong>
      ${obra.nome}
      <div class="meta">${obra.cliente}</div>
      <div class="meta">${obra.responsavel}</div>
    `;

    const col = document.getElementById(cols[obra.status] || 'col-adjudicada');
    col.appendChild(card);
  });
}

function renderList(){
  const body = document.getElementById('listBody');
  body.innerHTML = state.obras.map(o => `
    <tr>
      <td>${o.referencia}</td>
      <td>${o.nome}</td>
      <td>${o.cliente}</td>
      <td>${o.status}</td>
      <td>${o.responsavel}</td>
    </tr>
  `).join('');
}

function render(){
  renderKanban();
  renderList();
}

document.getElementById('btnNova').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('hidden');
});

document.getElementById('btnCancelar').addEventListener('click', () => {
  document.getElementById('modal').classList.add('hidden');
});

document.getElementById('btnGuardar').addEventListener('click', async () => {
  const obra = {
    id: cid(),
    referencia: nextReferencia(),
    nome: document.getElementById('obraNome').value.trim(),
    cliente: document.getElementById('obraCliente').value.trim(),
    status: document.getElementById('obraEstado').value,
    responsavel: document.getElementById('obraResponsavel').value.trim(),
    notas: document.getElementById('obraNotas').value.trim()
  };

  if(!obra.nome){
    alert('Indica o nome da obra');
    return;
  }

  state.obras.unshift(obra);
  await saveObra(obra);
  render();

  document.getElementById('modal').classList.add('hidden');
  document.getElementById('obraNome').value = '';
  document.getElementById('obraCliente').value = '';
  document.getElementById('obraResponsavel').value = '';
  document.getElementById('obraNotas').value = '';
});

document.getElementById('btnKanban').addEventListener('click', () => {
  document.getElementById('kanbanView').classList.remove('hidden');
  document.getElementById('listView').classList.add('hidden');
});

document.getElementById('btnLista').addEventListener('click', () => {
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('kanbanView').classList.add('hidden');
});

loadData();
</script>

</body>
</html>
