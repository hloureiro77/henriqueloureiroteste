<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Obras — Alumínios do Zela</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#eef0f2;
      color:#20242a;
    }

    header{
      background:#1d3e60;
      color:white;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    h1{margin:0;font-size:22px;}

    .container{padding:20px;}

    .form{
      background:white;
      padding:16px;
      border-radius:8px;
      margin-bottom:20px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .form input,
    .form select,
    .form textarea{
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:14px;
    }

    .form textarea{
      grid-column:1/-1;
      min-height:70px;
    }

    .form button{
      grid-column:1/-1;
      padding:12px;
      background:#2e5c8a;
      color:white;
      border:none;
      border-radius:6px;
      font-size:15px;
      cursor:pointer;
    }

    .obra{
      background:white;
      border-left:4px solid #2e5c8a;
      border-radius:8px;
      padding:14px;
      margin-bottom:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }

    .obra h3{margin:0 0 6px;}

    .meta{font-size:13px;color:#555;margin-bottom:6px;}

    .actions{margin-top:10px;}

    .actions button{
      padding:6px 10px;
      border:none;
      border-radius:4px;
      cursor:pointer;
    }

    .delete{background:#c0392b;color:white;}

    @media(max-width:700px){
      .form{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<header>
  <h1>Mapa de Obras — Alumínios do Zela</h1>
  <button onclick="limparTudo()" style="padding:8px 12px;border:none;border-radius:4px;background:#c0392b;color:white;cursor:pointer;">Limpar Tudo</button>
</header>

<div class="container">

  <div class="form">
    <input id="nome" placeholder="Nome da obra">
    <input id="cliente" placeholder="Cliente">
    <select id="estado">
      <option>Adjudicada</option>
      <option>Em Preparação</option>
      <option>Pronta a Montar</option>
      <option>Em Montagem</option>
      <option>Concluída</option>
    </select>
    <input id="responsavel" placeholder="Responsável">
    <input id="valor" type="number" placeholder="Valor (€)">
    <input id="data" type="date">
    <textarea id="notas" placeholder="Notas / observações"></textarea>
    <button onclick="adicionarObra()">Guardar Obra</button>
  </div>

  <div id="lista"></div>
</div>

<script>
const STORAGE_KEY = 'obras-zela-v2';

let obras = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function guardar(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obras));
}

function render(){
  const lista = document.getElementById('lista');

  if(!obras.length){
    lista.innerHTML = '<p>Sem obras registadas.</p>';
    return;
  }

  lista.innerHTML = obras.map((o,i)=>`
    <div class="obra">
      <h3>${o.nome}</h3>
      <div class="meta">
        <strong>Cliente:</strong> ${o.cliente || '-'} <br>
        <strong>Estado:</strong> ${o.estado} <br>
        <strong>Responsável:</strong> ${o.responsavel || '-'} <br>
        <strong>Valor:</strong> ${o.valor ? Number(o.valor).toLocaleString('pt-PT')+' €' : '-'} <br>
        <strong>Data:</strong> ${o.data || '-'}
      </div>
      ${o.notas ? `<div>${o.notas}</div>` : ''}
      <div class="actions">
        <button class="delete" onclick="eliminar(${i})">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function adicionarObra(){
  const nome = document.getElementById('nome').value.trim();

  if(!nome){
    alert('Indica o nome da obra');
    return;
  }

  obras.unshift({
    nome,
    cliente: document.getElementById('cliente').value.trim(),
    estado: document.getElementById('estado').value,
    responsavel: document.getElementById('responsavel').value.trim(),
    valor: document.getElementById('valor').value,
    data: document.getElementById('data').value,
    notas: document.getElementById('notas').value.trim()
  });

  guardar();
  render();

  document.querySelectorAll('.form input, .form textarea').forEach(el=>el.value='');
  document.getElementById('estado').selectedIndex = 0;
}

function eliminar(i){
  if(confirm('Eliminar esta obra?')){
    obras.splice(i,1);
    guardar();
    render();
  }
}

function limparTudo(){
  if(confirm('Apagar todas as obras guardadas neste computador?')){
    obras = [];
    guardar();
    render();
  }
}

render();
</script>

</body>
</html>
