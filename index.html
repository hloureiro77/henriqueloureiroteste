<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Obras — Alumínios do Zela, Lda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2;
  --surface:#FFFFFF;
  --surface-alt:#F6F7F8;
  --ink:#20242A;
  --ink-soft:#616A76;
  --ink-faint:#8B93A0;
  --line:#DBDFE4;
  --line-strong:#C3C9D1;
  --steel:#2E5C8A;
  --steel-dark:#1D3E60;
  --steel-light:#E7EEF5;
  --amber:#C97A1D;
  --amber-light:#FBEEDC;
  --purple:#6B4FA0;
  --purple-light:#EFEAF8;
  --green:#2F8558;
  --green-light:#E5F3EB;
  --grey-mid:#5A6270;
  --grey-light:#EAEBED;
  --red:#B23A2E;
  --red-light:#FBE9E7;
  --radius-sm:3px;
  --radius:6px;
  --shadow-card:0 1px 2px rgba(20,24,29,.06), 0 1px 1px rgba(20,24,29,.04);
  --shadow-pop:0 12px 32px rgba(20,24,29,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.02em;
}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:220px;
  flex-shrink:0;
  background:linear-gradient(180deg,#1D3E60,#152F49);
  color:#DCE6F0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:22px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.1);
  position:relative;
}
.brand .rivet{position:absolute; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); box-shadow: inset 0 1px 1px rgba(0,0,0,.4);}
.brand .rivet.tl{top:10px; left:10px;} .brand .rivet.tr{top:10px; right:10px;}
.brand-name{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:20px;
  line-height:1.05;
  text-transform:uppercase;
  letter-spacing:.03em;
  color:#fff;
}
.brand-sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.12em;
  color:#8FADCB;
  text-transform:uppercase;
  margin-top:4px;
}
.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  color:#B9CBDF;
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  border:none;
  background:transparent;
  text-align:left;
  width:100%;
  font-family:inherit;
  transition:background .12s ease, color .12s ease;
}
.nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:#2E5C8A; color:#fff;}
.nav-section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#6E8CAB;
  padding:14px 12px 4px;
}
.sidebar-foot{
  padding:14px 16px 18px;
  border-top:1px solid rgba(255,255,255,.1);
  font-size:11px;
  color:#7594B3;
  line-height:1.5;
}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:16px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  flex-wrap:wrap;
  position:sticky; top:0; z-index:20;
}
.topbar h1{margin:0; font-size:22px; font-weight:700; text-transform:uppercase;}
.topbar .subtitle{font-size:12px; color:var(--ink-soft); margin-top:2px; font-family:'Inter',sans-serif;}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.btn{
  font-family:'Inter',sans-serif;
  font-size:13px; font-weight:600;
  padding:8px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:all .12s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-alt); border-color:var(--ink-faint);}
.btn-primary{background:var(--steel); border-color:var(--steel); color:#fff;}
.btn-primary:hover{background:var(--steel-dark); border-color:var(--steel-dark);}
.btn-danger{color:var(--red); border-color:#E7C4BE;}
.btn-danger:hover{background:var(--red-light);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-alt);}
.btn svg{width:14px; height:14px;}
.btn-sm{padding:5px 9px; font-size:12px;}
.btn-icon{padding:7px; width:32px; height:32px; justify-content:center;}

.content{padding:22px 26px 60px; flex:1;}

/* ---------- KPI strip ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:22px;}
.kpi-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow-card);
  position:relative;
  overflow:hidden;
}
.kpi-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent,var(--steel));}
.kpi-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);}
.kpi-value{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:28px; margin-top:4px; color:var(--ink);}
.kpi-value small{font-size:14px; font-weight:600; color:var(--ink-soft);}
.kpi-foot{font-size:11px; color:var(--ink-faint); margin-top:2px;}

/* ---------- Kanban ---------- */
.board-wrap{overflow-x:auto; padding-bottom:10px;}
.board{display:flex; gap:14px; align-items:flex-start; min-width:max-content;}
.column{
  width:290px; flex-shrink:0;
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-radius:var(--radius);
  display:flex; flex-direction:column;
  max-height:calc(100vh - 260px);
}
.column-head{
  padding:11px 13px 10px;
  border-bottom:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0;
  position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)),
    repeating-linear-gradient(115deg, rgba(0,0,0,.025) 0px, rgba(0,0,0,.025) 1px, transparent 1px, transparent 5px),
    var(--col-color, var(--steel-light));
}
.column-head .rivet{position:absolute; width:5px; height:5px; border-radius:50%; background:rgba(0,0,0,.18); top:8px;}
.column-head .rivet.l{left:8px;} .column-head .rivet.r{right:8px;}
.column-title{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; justify-content:space-between;}
.column-count{font-family:'IBM Plex Mono',monospace; font-size:11px; background:rgba(255,255,255,.6); padding:1px 7px; border-radius:20px;}
.column-total{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px;}
.column-body{padding:10px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; flex:1;}
.column-body.dragover{background:var(--steel-light);}
.column-empty{font-size:12px; color:var(--ink-faint); text-align:center; padding:20px 8px; border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm);}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:3px solid var(--accent, var(--steel));
  border-radius:var(--radius-sm);
  padding:10px 11px;
  cursor:grab;
  box-shadow:var(--shadow-card);
  transition:box-shadow .12s ease, transform .12s ease;
}
.card:hover{box-shadow:0 4px 12px rgba(20,24,29,.12); transform:translateY(-1px);}
.card.dragging{opacity:.4;}
.card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
.card-ref{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint);}
.priority-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.priority-alta{background:var(--red);} .priority-media{background:var(--amber);} .priority-baixa{background:var(--ink-faint);}
.card-title{font-weight:700; font-size:13.5px; line-height:1.25; margin-bottom:3px;}
.card-client{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
.card-meta{font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-bottom:3px;}
.card-meta svg{width:12px; height:12px; opacity:.7; flex-shrink:0;}
.card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px; padding-top:7px; border-top:1px solid var(--line);}
.card-value{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;}
.badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
.badge-atraso{background:var(--red-light); color:var(--red);}
.badge-brevemente{background:var(--amber-light); color:var(--amber);}
.card-actions{display:flex; gap:4px;}
.card-actions button{background:none; border:none; cursor:pointer; padding:3px; color:var(--ink-faint); border-radius:3px;}
.card-actions button:hover{background:var(--surface-alt); color:var(--ink);}
.card-actions svg{width:14px; height:14px;}

/* ---------- Dashboard extras ---------- */
.panels{display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:22px;}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-card);}
.panel h3{margin:0 0 10px; font-size:15px; text-transform:uppercase; display:flex; align-items:center; gap:7px;}
.panel-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line);}
.panel-row:last-child{border-bottom:none;}
.panel-row-title{font-weight:600; font-size:12.5px;}
.panel-row-sub{font-size:11px; color:var(--ink-soft);}
.empty-note{font-size:12px; color:var(--ink-faint); padding:10px 0;}

/* ---------- Calendar ---------- */
.cal-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.cal-toolbar .label{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; min-width:190px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding-bottom:4px; letter-spacing:.08em;}
.cal-cell{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  min-height:104px; padding:6px 6px; display:flex; flex-direction:column; gap:3px;
}
.cal-cell.out{background:var(--surface-alt); opacity:.55;}
.cal-cell.today{border-color:var(--steel); box-shadow:inset 0 0 0 1px var(--steel);}
.cal-daynum{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); font-weight:600;}
.cal-chip{
  font-size:10.5px; padding:2px 5px; border-radius:3px; border-left:2.5px solid var(--accent,var(--steel));
  background:var(--surface-alt); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-chip:hover{background:var(--grey-light);}
.cal-more{font-size:10px; color:var(--ink-faint); padding-left:2px;}

/* ---------- List / table ---------- */
.filters-bar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.filters-bar input[type=text], .filters-bar select{
  font-family:'Inter',sans-serif; font-size:13px; padding:7px 10px;
  border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
}
.filters-bar input[type=text]{min-width:220px;}
table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-soft); background:var(--surface-alt); padding:9px 12px; border-bottom:1px solid var(--line);
}
td{padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-alt);}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap;}

/* status color helpers */
.s-adjudicada{--accent:var(--steel); --col-color:var(--steel-light);} .pill-adjudicada{background:var(--steel-light); color:var(--steel-dark);}
.s-preparacao{--accent:var(--amber); --col-color:var(--amber-light);} .pill-preparacao{background:var(--amber-light); color:#8A5312;}
.s-pronta{--accent:var(--purple); --col-color:var(--purple-light);} .pill-pronta{background:var(--purple-light); color:var(--purple);}
.s-montagem{--accent:var(--green); --col-color:var(--green-light);} .pill-montagem{background:var(--green-light); color:var(--green);}
.s-concluida{--accent:var(--grey-mid); --col-color:var(--grey-light);} .pill-concluida{background:var(--grey-light); color:var(--grey-mid);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,20,28,.5); display:none;
  align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface); border-radius:var(--radius); width:100%; max-width:640px;
  box-shadow:var(--shadow-pop); animation:pop .14s ease;
}
@keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:none; opacity:1;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h2{margin:0; font-size:19px; text-transform:uppercase;}
.modal-body{padding:20px 22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
.field input, .field select, .field textarea{
  font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 10px;
  border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
}
.field textarea{resize:vertical; min-height:60px; font-family:'Inter',sans-serif;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--steel); outline-offset:0; border-color:var(--steel);}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px;}

/* ---------- Toast ---------- */
#toast{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast-item{
  background:var(--ink); color:#fff; padding:10px 16px; border-radius:var(--radius-sm); font-size:13px;
  box-shadow:var(--shadow-pop); display:flex; align-items:center; gap:8px; animation:slidein .18s ease;
}
.toast-item.err{background:var(--red);}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:none; opacity:1;}}

/* ---------- misc ---------- */
.icon{width:16px; height:16px;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
.hint{font-size:11px; color:var(--ink-faint); margin-top:10px; line-height:1.5;}

@media (max-width: 880px){
  .sidebar{position:fixed; left:0; right:0; bottom:0; top:auto; width:100%; height:auto; flex-direction:row; z-index:50;}
  .brand{display:none;}
  .sidebar-foot{display:none;}
  .nav{flex-direction:row; overflow-x:auto; padding:8px;}
  .nav-section-label{display:none;}
  .nav-item span{display:none;}
  .nav-item{padding:10px;}
  #app{padding-bottom:56px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .panels{grid-template-columns:1fr;}
  .modal-body{grid-template-columns:1fr;}
  .topbar{padding:14px 16px;}
  .content{padding:16px;}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="rivet tl"></span><span class="rivet tr"></span>
      <div class="brand-name">Alumínios<br>do Zela</div>
      <div class="brand-sub">Mapa de Obras · Lda</div>
    </div>
    <nav class="nav">
      <div class="nav-section-label">Visão geral</div>
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Painel</span></button>
      <div class="nav-section-label">Gestão</div>
      <button class="nav-item" data-view="kanban"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg><span>Mapa de Obras</span></button>
      <button class="nav-item" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg><span>Planificação Mensal</span></button>
      <button class="nav-item" data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg><span>Lista de Obras</span></button>
    <button class="nav-item" data-view="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></button>
    </nav>
    <div class="sidebar-foot">Dados partilhados por todos os utilizadores deste separador.</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Mapa de Obras</h1>
        <div class="subtitle" id="viewSubtitle">Estado atual de todas as obras da empresa</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="btnExport" title="Exportar CSV">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Exportar
        </button>
        <button class="btn btn-ghost btn-sm" id="btnPrint" title="Imprimir">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H4a1 1 0 01-1-1v-5a1 1 0 011-1h16a1 1 0 011 1v5a1 1 0 01-1 1h-2"/></svg>Imprimir
        </button>
        <button class="btn btn-primary" id="btnNovaObra">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova Obra
        </button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nova Obra</h2>
      <button class="btn btn-ghost btn-icon" id="btnCloseModal">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="obraForm">
      <div class="modal-body">
        <div class="field full">
          <label>Nome da obra</label>
          <input type="text" id="f_nome" required placeholder="Ex: Moradia Sr. Almeida — Caixilharia">
        </div>
        <div class="field">
          <label>Cliente</label>
          <input type="text" id="f_cliente" required placeholder="Nome do cliente">
        </div>

/* ---------- KPI helpers ---------- */
function computeKPIs(){
  const ativas = state.obras.filter(o=>o.status!=='concluida');
  const valorCarteira = ativas.reduce((s,o)=>s+(Number(o.valor)||0),0);
  const atrasadas = ativas.filter(o=>{ const d=daysDiff(o.dataMontagem); return d!==null && d<0; });
  const brevemente = ativas.filter(o=>{ const d=daysDiff(o.dataMontagem); return d!==null && d>=0 && d<=7; });
  const concluidasMes = state.obras.filter(o=>{
    if(o.status!=='concluida' || !o.dataMontagem) return false;
    const d = new Date(o.dataMontagem+'T00:00:00'); const n = new Date();
    return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
  });
  return {total: state.obras.length, ativas: ativas.length, valorCarteira, atrasadas, brevemente, concluidasMes};
}

function kpiStripHTML(){
  const k = computeKPIs();
  return '<div class="kpi-grid">'
    + kpiCard('Obras Ativas', k.ativas, 'de '+k.total+' no total', 'var(--steel)')
    + kpiCard('Valor em Carteira', fmtCurrency(k.valorCarteira), 'obras não concluídas', 'var(--green)')
    + kpiCard('Atrasadas', k.atrasadas.length, 'passaram a data prevista', 'var(--red)')
    + kpiCard('Próx. 7 Dias', k.brevemente.length, 'montagens a aproximar-se', 'var(--amber)')
    + kpiCard('Concluídas Este Mês', k.concluidasMes.length, 'obras entregues', 'var(--grey-mid)')
    + '</div>';
}

/* ---------- Calendar view ---------- */
function renderCalendarView(){
  const y = state.calYear, m = state.calMonth;
  const monthLabel = new Intl.DateTimeFormat('pt-PT',{month:'long', year:'numeric'}).format(new Date(y,m,1));
  const firstDow = (new Date(y,m,1).getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrevMonth = new Date(y,m,0).getDate();

  const byDay = {};
  state.obras.forEach(o=>{
    if(!o.dataMontagem) return;
    const d = new Date(o.dataMontagem+'T00:00:00');
    if(d.getFullYear()===y && d.getMonth()===m){
      const day = d.getDate();
      (byDay[day] = byDay[day]||[]).push(o);
    }
  });

  let html = '<div class="cal-toolbar">'
    + '<button class="btn btn-sm" id="calPrev">‹</button>'
    + '<div class="label">'+cap(monthLabel)+'</div>'
    + '<button class="btn btn-sm" id="calNext">›</button>'
    + '<button class="btn btn-sm btn-ghost" id="calToday">Hoje</button>'
    + '</div><div class="cal-grid">';

  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(d=> html += '<div class="cal-dow">'+d+'</div>');

  for(let i=0;i<firstDow;i++){
    const dnum = daysInPrevMonth - firstDow + 1 + i;
    html += '<div class="cal-cell out"><div class="cal-daynum">'+dnum+'</div></div>';
  }
  const isCurMonth = (new Date().getFullYear()===y && new Date().getMonth()===m);
  for(let day=1; day<=daysInMonth; day++){
    const isToday = isCurMonth && new Date().getDate()===day;
    const list = byDay[day]||[];
    html += '<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-daynum">'+day+'</div>';
    list.slice(0,3).forEach(o=>{
      html += '<div class="cal-chip s-'+o.status+'" data-open="'+o.id+'" title="'+esc(o.nome)+' — '+esc(o.cliente)+'">'+esc(o.referencia||'')+' · '+esc(o.cliente)+'</div>';
    });
    if(list.length>3) html += '<div class="cal-more">+'+(list.length-3)+' obra(s)</div>';
    html += '</div>';
  }
  const totalCells = firstDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=remaining;i++){
    html += '<div class="cal-cell out"><div class="cal-daynum">'+i+'</div></div>';
  }
  html += '</div>';

  const semData = state.obras.filter(o=>o.status!=='concluida' && !o.dataMontagem);
  html += '<div class="panel" style="margin-top:16px;"><h3>Por Agendar — sem data de montagem</h3>';
  if(!semData.length) html += '<div class="empty-note">Todas as obras ativas têm data de montagem definida.</div>';
  else semData.forEach(o=>{
    html += '<div class="panel-row" data-open="'+o.id+'" style="cursor:pointer"><div><div class="panel-row-title">'+esc(o.nome)+'</div><div class="panel-row-sub">'+esc(o.cliente)+'</div></div><span class="status-pill pill-'+o.status+'">'+statusLabel(o.status)+'</span></div>';
  });
  html += '</div>';

  return html;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

        + '<td>'+esc(o.responsavel||'—')+'</td>'
        + '<td>'+fmtDate(o.dataMontagem)+'</td>'
        + '<td class="mono">'+fmtCurrency(o.valor)+'</td>'
        + '<td><button class="btn btn-ghost btn-icon" data-open="'+o.id+'" title="Editar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button></td>'
        + '</tr>';
    });
  }
  html += '</tbody></table>';
  return html;

/* ---------- events per view ---------- */
function attachViewEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openModal(el.dataset.open));
  });

  if(state.view==='kanban'){
    document.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.id); });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
      card.addEventListener('click', e=>{ if(!card.classList.contains('dragging')) openModal(card.dataset.id); });
    });
    document.querySelectorAll('.column-body').forEach(col=>{
      col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
      col.addEventListener('drop', e=>{
        e.preventDefault(); col.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        const o = state.obras.find(x=>x.id===id);
        if(o && o.status!==col.dataset.status){
          o.status = col.dataset.status;
          saveData(false); render(); toast('Estado atualizado: '+statusLabel(o.status));
        }
      });
    });
  }

  if(state.view==='calendar'){
    document.getElementById('calPrev').addEventListener('click', ()=>{ shiftMonth(-1); });
    document.getElementById('calNext').addEventListener('click', ()=>{ shiftMonth(1); });
    document.getElementById('calToday').addEventListener('click', ()=>{
      const n = new Date(); state.calMonth = n.getMonth(); state.calYear = n.getFullYear(); render();
    });
  }

  if(state.view==='list'){
    const s = document.getElementById('fltSearch');
    const st = document.getElementById('fltStatus');
    const rp = document.getElementById('fltResp');
    const cl = document.getElementById('fltClear');
    s.addEventListener('input', ()=>{ state.filters.search = s.value; render(); document.getElementById('fltSearch').focus(); document.getElementById('fltSearch').setSelectionRange(s.value.length,s.value.length); });
    st.addEventListener('change', ()=>{ state.filters.status = st.value; render(); });
    rp.addEventListener('change', ()=>{ state.filters.responsavel = rp.value; render(); });
    if(cl) cl.addEventListener('click', ()=>{ state.filters={status:'',responsavel:'',search:''}; render(); });
  }
}
function shiftMonth(delta){
  let m = state.calMonth + delta, y = state.calYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calMonth=m; state.calYear=y; render();
}



function renderAgendaView(){
const colaboradores=["mauricio","henrique","helder","tiago","joao"];
if(!state.tasks) state.tasks=JSON.parse(localStorage.getItem("agendaTasks")||"[]");
const obraOpts=state.obras.map(o=>`<option value="${o.id}">${esc(o.referencia||"")} - ${esc(o.nome)}</option>`).join("");
let rows=state.tasks.map((t,i)=>`<tr>
<td>${esc(t.colaborador)}</td><td>${esc(t.tipo)}</td><td>${esc(t.data)}</td><td>${esc(t.hora)}</td><td>${esc(t.obraNome||"—")}</td>
<td><button class="btn btn-sm" onclick="window.editTask(${i})">Editar</button> <button class="btn btn-danger btn-sm" onclick="window.delTask(${i})">Eliminar</button></td></tr>`).join("");
if(!rows) rows='<tr><td colspan="6" style="text-align:center">Sem tarefas.</td></tr>';
setTimeout(()=>{
const f=document.getElementById("taskForm"); if(!f) return;
f.onsubmit=(e)=>{e.preventDefault();
const idx=f.dataset.idx;
const obra=state.obras.find(o=>o.id===f.obra.value);
const obj={colaborador:f.col.value,tipo:f.tipo.value,data:f.data.value,hora:f.hora.value,obra:f.obra.value,obraNome:obra?obra.nome:""};
if(idx===""){state.tasks.push(obj);}else{state.tasks[idx]=obj;}
localStorage.setItem("agendaTasks",JSON.stringify(state.tasks)); render();};
window.editTask=(i)=>{const t=state.tasks[i];f.dataset.idx=i;f.col.value=t.colaborador;f.tipo.value=t.tipo;f.data.value=t.data;f.hora.value=t.hora;f.obra.value=t.obra;};
window.delTask=(i)=>{state.tasks.splice(i,1);localStorage.setItem("agendaTasks",JSON.stringify(state.tasks));render();};
document.getElementById("newTask").onclick=()=>{f.reset();f.dataset.idx="";};
},0);
return `<div class="panel"><h3>Agenda de Colaboradores</h3>
<form id="taskForm" data-idx="">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px">
<select name="col">${colaboradores.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
<select name="tipo"><option>Ir tirar medidas</option><option>Montagem</option><option>Assistência</option><option>Entrega</option><option>Reunião</option><option>Outros</option></select>
<input type="date" name="data" required>
<input type="time" name="hora" required>
<select name="obra"><option value="">Sem obra</option>${obraOpts}</select>
<button class="btn btn-primary" type="submit">Guardar</button>
</div></form>
<button id="newTask" class="btn">Nova tarefa</button>
<table><thead><tr><th>Colaborador</th><th>Tarefa</th><th>Data</th><th>Hora</th><th>Obra</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}


/* ---------- modal ---------- */
const overlay = document.getElementById('overlay');
const form = document.getElementById('obraForm');

function openModal(id){
  state.editingId = id || null;
  const o = id ? state.obras.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = o ? 'Editar Obra — '+(o.referencia||'') : 'Nova Obra';
  document.getElementById('btnDeleteObra').style.display = o ? 'inline-flex' : 'none';
  document.getElementById('f_nome').value = o ? o.nome : '';
  document.getElementById('f_cliente').value = o ? o.cliente : '';
  document.getElementById('f_contacto').value = o ? (o.contacto||'') : '';
  document.getElementById('f_morada').value = o ? (o.morada||'') : '';
  document.getElementById('f_status').value = o ? o.status : 'adjudicada';
  document.getElementById('f_prioridade').value = o ? o.prioridade : 'media';
  document.getElementById('f_responsavel').value = o ? (o.responsavel||'') : '';
  document.getElementById('f_valor').value = o ? (o.valor||'') : '';
  document.getElementById('f_dataAdjudicacao').value = o ? (o.dataAdjudicacao||'') : todayISO();
  document.getElementById('f_dataMontagem').value = o ? (o.dataMontagem||'') : '';
  document.getElementById('f_notas').value = o ? (o.notas||'') : '';
  overlay.classList.add('open');
  setTimeout(()=>document.getElementById('f_nome').focus(), 30);
}
function closeModal(){ overlay.classList.remove('open'); state.editingId = null; }

document.getElementById('btnNovaObra').addEventListener('click', ()=> openModal(null));
document.getElementById('btnCloseModal').addEventListener('click', closeModal);
document.getElementById('btnCancelModal').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const data = {
    nome: document.getElementById('f_nome').value.trim(),
    cliente: document.getElementById('f_cliente').value.trim(),
    contacto: document.getElementById('f_contacto').value.trim(),
    morada: document.getElementById('f_morada').value.trim(),
    status: document.getElementById('f_status').value,
    prioridade: document.getElementById('f_prioridade').value,
    responsavel: document.getElementById('f_responsavel').value.trim(),
    valor: document.getElementById('f_valor').value ? Number(document.getElementById('f_valor').value) : null,
    dataAdjudicacao: document.getElementById('f_dataAdjudicacao').value || null,
    dataMontagem: document.getElementById('f_dataMontagem').value || null,
    notas: document.getElementById('f_notas').value.trim(),
  };
  if(!data.nome || !data.cliente){ toast('Preencha pelo menos o nome e o cliente.', true); return; }

  if(state.editingId){
    const o = state.obras.find(x=>x.id===state.editingId);
    Object.assign(o, data);
  } else {
    data.id = cid();
    data.referencia = nextReferencia();
    state.obras.push(data);
  }
  await saveData(true);
  closeModal();
  render();
});

document.getElementById('btnDeleteObra').addEventListener('click', async ()=>{
  if(!state.editingId) return;
  if(!confirm('Eliminar esta obra? Esta ação não pode ser desfeita.')) return;
  state.obras = state.obras.filter(o=>o.id!==state.editingId);
  await saveData(false);
  toast('Obra eliminada.');
  closeModal();
  render();
});

/* ---------- export / print ---------- */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const headers = ['Referência','Obra','Cliente','Contacto','Morada','Estado','Prioridade','Responsável','Valor','Data Adjudicação','Data Montagem','Notas'];
  const rows = state.obras.map(o=>[
    o.referencia,o.nome,o.cliente,o.contacto,o.morada,statusLabel(o.status),o.prioridade,o.responsavel,o.valor,o.dataAdjudicacao,o.dataMontagem,o.notas
  ]);
  const csv = [headers, ...rows].map(r => r.map(v=>{
    const s = (v===null||v===undefined) ? '' : String(v);
    return '"'+s.replace(/"/g,'""')+'"';
  }).join(';')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mapa-obras-zela-'+todayISO()+'.csv';
  a.click();
  toast('Ficheiro CSV exportado.');
});
document.getElementById('btnPrint').addEventListener('click', ()=> window.print());

/* ---------- utils ---------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- init ---------- */
document.querySelector('.nav-item[data-view="kanban"]').classList.add('active');
loadData();

})();
</script>
